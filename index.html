<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DragonBoat Pro v3</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .animate-beat { animation: pulse 0.1s ease-out; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="max-w-md w-full space-y-4 pt-2 pb-20">
        <header class="text-center mb-4">
            <h1 class="text-3xl font-black text-blue-500 italic tracking-tighter">DRAGON PRO <span class="text-white text-sm not-italic">v3</span></h1>
        </header>

        <!-- 훈련 시간 설정 -->
        <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800 shadow-xl">
            <h3 class="text-[10px] font-black text-blue-400 uppercase mb-3 tracking-widest">Total Training Timer</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[9px] text-slate-500 font-bold ml-1">MINUTES</label>
                    <input type="number" id="t-min" value="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-xl">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] text-slate-500 font-bold ml-1">SECONDS</label>
                    <input type="number" id="t-sec" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-xl">
                </div>
            </div>
        </div>

        <!-- 3단계 상세 설정 -->
        <div id="settings" class="bg-slate-900 rounded-3xl p-5 border border-slate-800 space-y-5 shadow-xl">
            <!-- Phase 1 -->
            <div class="space-y-2">
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Phase 1: Start</div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="p1-spm" value="60" placeholder="SPM" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500">
                    <input type="number" id="p1-cnt" value="10" placeholder="Count" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-yellow-500">
                </div>
            </div>
            <!-- Phase 2 -->
            <div class="space-y-2 pt-2 border-t border-slate-800/50">
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Phase 2: Spurt</div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="p2-spm" value="90" placeholder="SPM" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500">
                    <input type="number" id="p2-cnt" value="20" placeholder="Count" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-yellow-500">
                </div>
            </div>
            <!-- Phase 3 -->
            <div class="space-y-2 pt-2 border-t border-slate-800/50">
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Phase 3: Cruise</div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="p3-spm" value="80" placeholder="SPM" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500">
                    <input type="number" id="p3-cnt" value="999" placeholder="Count" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-yellow-500">
                </div>
            </div>
        </div>

        <!-- 훈련 디스플레이 -->
        <div id="display" class="hidden bg-slate-900 rounded-[2.5rem] p-8 border border-blue-500/30 text-center relative overflow-hidden shadow-2xl">
            <div id="time-left" class="text-3xl font-mono font-black text-blue-500 mb-6">00:00</div>
            <div id="phase-tag" class="text-[10px] font-black text-slate-500 mb-2 tracking-widest uppercase bg-slate-950 py-1 rounded-full w-24 mx-auto">READY</div>
            <div id="val-spm" class="text-8xl font-black leading-none text-white mb-8 tracking-tighter">0</div>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950 rounded-2xl py-5 border border-slate-800">
                    <div class="text-[9px] text-slate-600 font-bold mb-1 uppercase tracking-widest">Stroke</div>
                    <div id="val-cnt" class="text-4xl font-mono font-bold text-yellow-500">0</div>
                </div>
                <div id="beat-box" class="flex items-center justify-center bg-slate-950 rounded-2xl border border-slate-800">
                    <div id="beat-dot" class="w-10 h-10 bg-white rounded-full opacity-5 blur-sm"></div>
                </div>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="fixed bottom-6 left-0 right-0 px-6 max-w-md mx-auto">
            <button id="btn-start" class="w-full bg-blue-600 text-white py-5 rounded-2xl text-2xl font-black shadow-2xl active:scale-95 transition-all">START</button>
            <button id="btn-stop" class="hidden w-full bg-rose-600 text-white py-5 rounded-2xl text-2xl font-black active:scale-95 transition-all">STOP</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let timerID = null;
        let countdownID = null;
        let nextTime = 0;
        let phaseIdx = 0;
        let strokeIdx = 0;
        let timeLeft = 0;
        let prog = [];

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            const b = audioCtx.createBuffer(1, 1, 22050);
            const s = audioCtx.createBufferSource();
            s.buffer = b; s.connect(audioCtx.destination);
            s.start(0);
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeat(time, isFirst) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(isFirst ? 1000 : 500, time);
            g.gain.setValueAtTime(0.4, time);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            osc.connect(g); g.connect(audioCtx.destination);
            osc.start(time); osc.stop(time + 0.1);

            const d = (time - audioCtx.currentTime) * 1000;
            setTimeout(() => {
                const dot = document.getElementById('beat-dot');
                dot.classList.add('animate-beat', 'opacity-100', 'bg-blue-400');
                setTimeout(() => dot.classList.remove('animate-beat', 'opacity-100', 'bg-blue-400'), 80);
            }, d);
        }

        function speak(text, callback) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US'; msg.rate = 1.0;
            msg.onend = callback;
            window.speechSynthesis.speak(msg);
        }

        function scheduler() {
            while (nextTime < audioCtx.currentTime + 0.1) {
                const p = prog[phaseIdx];
                playBeat(nextTime, strokeIdx === 0);
                
                const d = (nextTime - audioCtx.currentTime) * 1000;
                setTimeout(() => {
                    strokeIdx++;
                    document.getElementById('val-cnt').textContent = strokeIdx;
                    document.getElementById('val-spm').textContent = p.spm;
                    document.getElementById('phase-tag').textContent = p.name;
                    if (strokeIdx >= p.cnt && phaseIdx < prog.length - 1) {
                        phaseIdx++; strokeIdx = 0;
                    }
                }, d);
                nextTime += (60.0 / p.spm);
            }
            timerID = setTimeout(scheduler, 25);
        }

        document.getElementById('btn-start').onclick = () => {
            initAudio();
            
            const m = parseInt(document.getElementById('t-min').value) || 0;
            const s = parseInt(document.getElementById('t-sec').value) || 0;
            timeLeft = (m * 60) + s;

            prog = [
                { name: 'PHASE 1', spm: parseInt(document.getElementById('p1-spm').value), cnt: parseInt(document.getElementById('p1-cnt').value) },
                { name: 'PHASE 2', spm: parseInt(document.getElementById('p2-spm').value), cnt: parseInt(document.getElementById('p2-cnt').value) },
                { name: 'PHASE 3', spm: parseInt(document.getElementById('p3-spm').value), cnt: parseInt(document.getElementById('p3-cnt').value) }
            ];

            document.getElementById('settings').parentElement.querySelectorAll('.bg-slate-900').forEach(el => el.classList.add('hidden'));
            document.getElementById('display').classList.remove('hidden');
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');

            speak("Are you ready?", () => {
                setTimeout(() => {
                    speak("Attention!", () => {
                        setTimeout(() => {
                            speak("Go!", () => {
                                nextTime = audioCtx.currentTime + 0.1;
                                phaseIdx = 0; strokeIdx = 0;
                                scheduler();
                                startCountdown();
                            });
                        }, 500);
                    });
                }, 500);
            });
        };

        function startCountdown() {
            countdownID = setInterval(() => {
                if(timeLeft <= 0) { stopTraining(); return; }
                timeLeft--;
                const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const sec = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('time-left').textContent = `${min}:${sec}`;
            }, 1000);
        }

        function stopTraining() {
            clearTimeout(timerID);
            clearInterval(countdownID);
            window.speechSynthesis.cancel();
            document.getElementById('settings').parentElement.querySelectorAll('.bg-slate-900').forEach(el => el.classList.remove('hidden'));
            document.getElementById('display').classList.add('hidden');
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
            document.getElementById('time-left').textContent = "00:00";
        }

        document.getElementById('btn-stop').onclick = stopTraining;
    </script>
</body>
</html>
