<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DragonBoat Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } 100% { transform: scale(1); opacity: 1; } }
        .animate-beat { animation: pulse 0.1s ease-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4">

    <div class="max-w-md w-full space-y-4 pt-4">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-black text-blue-500 italic">DRAGON PRO</h1>
            <p class="text-slate-500 text-[10px] font-bold tracking-widest">iOS COMPATIBLE VERSION</p>
        </header>

        <!-- 시간 설정 -->
        <div class="bg-slate-900 rounded-3xl p-5 border border-slate-800">
            <h3 class="text-[10px] font-black text-slate-500 uppercase mb-3">Training Timer</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1">
                    <label class="text-[9px] text-slate-600 font-bold ml-1 text-blue-400">MINUTES</label>
                    <input type="number" id="t-min" value="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-xl">
                </div>
                <div class="space-y-1">
                    <label class="text-[9px] text-slate-600 font-bold ml-1 text-blue-400">SECONDS</label>
                    <input type="number" id="t-sec" value="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none focus:border-blue-500 text-xl">
                </div>
            </div>
        </div>

        <!-- 피치 설정 -->
        <div id="settings" class="bg-slate-900 rounded-3xl p-5 border border-slate-800 space-y-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2 text-[10px] font-bold text-slate-600">PHASE 1 (10회)</div>
                <input type="number" id="p1-spm" value="60" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none">
                <div class="flex items-center justify-center text-xs text-slate-700 font-bold">SPM</div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div class="col-span-2 text-[10px] font-bold text-slate-600">PHASE 2 (20회)</div>
                <input type="number" id="p2-spm" value="90" class="bg-slate-950 border border-slate-800 rounded-xl py-3 text-center font-bold outline-none">
                <div class="flex items-center justify-center text-xs text-slate-700 font-bold">SPM</div>
            </div>
        </div>

        <!-- 디스플레이 -->
        <div id="display" class="hidden bg-slate-900 rounded-[2.5rem] p-8 border border-blue-500/30 text-center relative overflow-hidden">
            <div id="time-left" class="text-blue-400 font-mono font-bold mb-4">00:00</div>
            <div id="phase-tag" class="text-[10px] font-black text-slate-500 mb-2 tracking-widest uppercase">READY</div>
            <div id="val-spm" class="text-8xl font-black leading-none text-white mb-6">0</div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-950 rounded-2xl py-4 border border-slate-800">
                    <div class="text-[9px] text-slate-600 font-bold mb-1">STROKE</div>
                    <div id="val-cnt" class="text-3xl font-mono font-bold text-yellow-500">0</div>
                </div>
                <div id="beat-box" class="flex items-center justify-center bg-slate-950 rounded-2xl border border-slate-800">
                    <div id="beat-dot" class="w-8 h-8 bg-white rounded-full opacity-5"></div>
                </div>
            </div>
        </div>

        <!-- 컨트롤 -->
        <button id="btn-start" class="w-full bg-white text-slate-950 py-5 rounded-2xl text-xl font-black shadow-2xl active:scale-95 transition-all">START TRAINING</button>
        <button id="btn-stop" class="hidden w-full bg-rose-600 text-white py-5 rounded-2xl text-xl font-black active:scale-95 transition-all">STOP</button>
    </div>

    <script>
        let audioCtx = null;
        let timerID = null;
        let countdownID = null;
        let nextTime = 0;
        let phaseIdx = 0;
        let strokeIdx = 0;
        let timeLeft = 0;
        let prog = [];

        // iOS Audio 초기화 함수
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // 아이폰에서 오디오 엔진을 강제로 깨우기 위해 빈 버퍼 재생
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playBeat(time, isFirst) {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(isFirst ? 1000 : 500, time);
            g.gain.setValueAtTime(0.3, time);
            g.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start(time);
            osc.stop(time + 0.1);

            const d = (time - audioCtx.currentTime) * 1000;
            setTimeout(() => {
                const dot = document.getElementById('beat-dot');
                dot.classList.add('animate-beat', 'opacity-90', 'bg-blue-500');
                setTimeout(() => dot.classList.remove('animate-beat', 'opacity-90', 'bg-blue-500'), 80);
            }, d);
        }

        function speak(text, callback) {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'en-US';
            msg.rate = 1.1;
            msg.onend = callback;
            window.speechSynthesis.speak(msg);
        }

        function scheduler() {
            while (nextTime < audioCtx.currentTime + 0.1) {
                const p = prog[phaseIdx];
                playBeat(nextTime, strokeIdx === 0);
                
                const d = (nextTime - audioCtx.currentTime) * 1000;
                setTimeout(() => {
                    strokeIdx++;
                    document.getElementById('val-cnt').textContent = strokeIdx;
                    document.getElementById('val-spm').textContent = p.spm;
                    document.getElementById('phase-tag').textContent = p.name;
                    if (strokeIdx >= p.cnt && phaseIdx < prog.length - 1) {
                        phaseIdx++; strokeIdx = 0;
                    }
                }, d);
                nextTime += (60.0 / p.spm);
            }
            timerID = setTimeout(scheduler, 25);
        }

        document.getElementById('btn-start').onclick = () => {
            initAudio(); // 버튼 클릭 시 즉시 오디오 엔진 활성화
            
            const m = parseInt(document.getElementById('t-min').value) || 0;
            const s = parseInt(document.getElementById('t-sec').value) || 0;
            timeLeft = (m * 60) + s;

            prog = [
                { name: 'START', spm: parseInt(document.getElementById('p1-spm').value), cnt: 10 },
                { name: 'SPURT', spm: parseInt(document.getElementById('p2-spm').value), cnt: 20 },
                { name: 'CRUISE', spm: 80, cnt: Infinity }
            ];

            document.getElementById('settings').classList.add('hidden');
            document.getElementById('display').classList.remove('hidden');
            document.getElementById('btn-start').classList.add('hidden');
            document.getElementById('btn-stop').classList.remove('hidden');

            speak("Are you ready?", () => {
                setTimeout(() => {
                    speak("Attention!", () => {
                        setTimeout(() => {
                            speak("Go!", () => {
                                nextTime = audioCtx.currentTime + 0.1;
                                phaseIdx = 0; strokeIdx = 0;
                                scheduler();
                                startCountdown();
                            });
                        }, 500);
                    });
                }, 500);
            });
        };

        function startCountdown() {
            countdownID = setInterval(() => {
                timeLeft--;
                const min = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                const sec = (timeLeft % 60).toString().padStart(2, '0');
                document.getElementById('time-left').textContent = `${min}:${sec}`;
                if (timeLeft <= 0) stopTraining();
            }, 1000);
        }

        function stopTraining() {
            clearTimeout(timerID);
            clearInterval(countdownID);
            document.getElementById('settings').classList.remove('hidden');
            document.getElementById('display').classList.add('hidden');
            document.getElementById('btn-start').classList.remove('hidden');
            document.getElementById('btn-stop').classList.add('hidden');
        }

        document.getElementById('btn-stop').onclick = stopTraining;
    </script>
</body>
</html>
